[project]
name = "flightcontrol"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "psycopg[binary,pool]>=3.3.6",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flightcontrol = "flightcontrol:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
