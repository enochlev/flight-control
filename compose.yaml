# Flight Control: the web site and the traffic engine share one SQLite file.
services:
  web:
    build: .
    command: ["flightcontrol", "web", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FC_ADMIN_PASSWORD: ${FC_ADMIN_PASSWORD:?set FC_ADMIN_PASSWORD in .env}
      FC_PUBLIC_URL: ${FC_PUBLIC_URL:-http://localhost:8000}
      FC_DEV: ${FC_DEV:-0}
    volumes: [fcdata:/data]
    ports: ["127.0.0.1:${FC_PORT:-8000}:8000"]
    restart: unless-stopped
  engine:
    build: .
    command: ["flightcontrol", "engine"]
    environment:
      FC_ALLOWED_HOST_SUFFIXES: ${FC_ALLOWED_HOST_SUFFIXES:-trycloudflare.com,enochlev.com}
      FC_HOUSE_URL: ${FC_HOUSE_URL:-}
      FC_HOUSE_KEY: ${FC_HOUSE_KEY:-}
      FC_HOUSE_RATE: ${FC_HOUSE_RATE:-2}
      FC_DEV: ${FC_DEV:-0}
    volumes: [fcdata:/data]
    restart: unless-stopped
volumes:
  fcdata:
